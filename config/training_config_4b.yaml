# ZDS v1.0 Training Configuration (MedTech Optimized)
# Aggressive config for Apple Silicon with 64 GB unified memory.
# Model Target: Qwen3-4B-Instruct (local path) - edge/mobile variant

# Dataset Paths
data: "data/app/training_data/" # Should contain train.jsonl and valid.jsonl

# Training mode
train: true

# Model Settings
model: "mlx-community/Qwen3-4B-bf16"
adapter_path: "models/adapters/genomics_v2_4b"

# LoRA Hyperparameters
fine_tune_type: "lora"
num_layers: 32
lora_parameters:
  rank: 64
  alpha: 128
  dropout: 0.05
  scale: 2.0  # alpha/rank

# Training Loop
# mlx-lm uses iterations, not epochs. With 715 train examples (refined dataset) and
# effective batch 16, ~45 optimizer steps per epoch. 1000 iterations is a MAXIMUM;
# the best checkpoint is selected by validation loss after the run (early stopping).
iters: 1000
batch_size: 4
gradient_accumulation_steps: 4 # Effective batch size 16; smaller bursts avoid Metal 'Impacting Interactivity' kills while the machine is in use
learning_rate: 2.0e-4

# Learning-rate schedule: cosine decay from 2e-4 -> 1e-6 over 1000 steps with 100 warmup steps
lr_schedule:
  name: cosine_decay
  arguments: [2.0e-4, 1000, 1.0e-6]
  warmup: 100

# Sequence length
max_seq_length: 2048

# Efficiency / quality
mask_prompt: true              # Train only on assistant responses, not user prompts
grad_checkpoint: true          # Keeps memory under ~55 GB despite large batch/rank

# Logging & checkpoints
steps_per_report: 10
steps_per_eval: 50
save_every: 200
val_batches: 25

# Reproducibility
seed: 42
